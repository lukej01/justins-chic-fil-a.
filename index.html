      effect: function(cb) {
        G.customerPatience = Math.max(0, G.customerPatience - 25);
        G.toast("Dropped the iPad! Cars honking! -25 patience", 'chaos');
        G.updateHUD();
        setTimeout(cb, 600);
      }
    },
    {
      name: 'fire_alarm',
      intro: "The fryer just set off the FIRE ALARM! The entire restaurant is PANICKING! Customers are running for the exits!",
      lukeReaction: "FALSE ALARM! EVERYONE CALM DOWN! Justin, go reset the alarm panel and then get back to work. We're losing customers by the SECOND!",
      effect: function(cb) {
        G.customerPatience = Math.max(0, G.customerPatience - 30);
        G.toast("FIRE ALARM! Total chaos! -30 patience", 'chaos');
        G.updateHUD();
        setTimeout(cb, 600);
      }
    },
    {
      name: 'mom_calls',
      intro: "Justin's phone starts RINGING in the middle of service. Loudly. It's his mom. Customers are staring.",
      lukeReaction: "Is that... is that your PHONE?! During SERVICE?! Your MOM is calling you?! Tell her you're WORKING, Justin!",
      choices: [
        { text: "*silences phone* Sorry! Won't happen again!", good: true },
        { text: "Hold on Luke, it might be important— Hi Mom...", good: false },
        { text: "I thought it was on silent I SWEAR!", good: true },
      ],
      effect: function(cb) {
        G.showDialog('luke', G.chaosEvents[7].lukeReaction, G.chaosEvents[7].choices.map(c => ({
          text: c.text,
          action: () => {
            if (c.good) {
              G.toast("Awkward... but crisis averted.", 'warn');
            } else {
              G.addStrike(0.5);
              G.toast("Luke looks like he's about to explode.", 'bad');
            }
            cb();
          }
        })));
        return true;
      }
    },
  ],

  // --- INIT ---
  start() {
    this.score=0; this.strikes=0; this.customersServed=0;
    this.ordersCorrect=0; this.ordersMessed=0; this.currentRound=0;
    this.customerPatience=100; this.isRunning=true; this.inMinigame=false;
    this.availableStation=null; this.patienceDrainRate=2.2; this.isReaganCustomer=false;
    Restaurant.justin = { x:0.5, y:0.45, tx:0.5, ty:0.45, frame:0, moving:false, targetStation:null };
    document.getElementById('title-screen').classList.remove('active');
    document.getElementById('fired-screen').classList.remove('active');
    document.getElementById('hud').classList.add('visible');
    this.updateHUD();
    this.showDialog('luke', R([
      "Alright Justin, welcome to another shift. Try not to embarrass us today.",
      "Justin! You're late. Again. Let's just... try to survive today.",
      "Okay Justin — customers come in, you go to the stations. Simple right? ...RIGHT?",
    ]), [
      { text:"I got this! Let's do it!", action:()=>this.nextRound() },
      { text:"I make no promises, Luke.", action:()=>{ this.toast("Luke sighs deeply...",'luke'); setTimeout(()=>this.nextRound(),1200); } },
    ]);
  },
  restart() { this.start(); },

  // --- HUD ---
  updateHUD() {
    document.getElementById('h-score').textContent = this.score;
    document.getElementById('h-strikes').textContent = `${Math.ceil(this.strikes)}/${this.maxStrikes}`;
    const pf = document.getElementById('patience-fill');
    pf.style.width = this.customerPatience + '%';
    pf.style.background = this.customerPatience > 50 ? 'var(--success)' : this.customerPatience > 25 ? 'var(--warn)' : 'var(--danger)';
  },

  // --- TIMER DISPLAY ---
  updateTimerDisplay() {
    const wrap = document.getElementById('mg-timer-wrap');
    if (!wrap) return;
    const pct = this.customerPatience;
    const cls = pct > 50 ? 'timer-ok' : pct > 25 ? 'timer-warn' : 'timer-crit';
    wrap.innerHTML = `<span class="mg-timer ${cls}">${Math.ceil(pct)}% PATIENCE</span>`;
  },

  // --- TOAST ---
  toast(msg, type='good') {
    const t = document.createElement('div');
    t.className = `toast toast-${type}`;
    t.textContent = msg;
    document.getElementById('game').appendChild(t);
    setTimeout(()=>t.remove(), 2500);
  },

  // --- WRONG ITEM FLASH ---
  wrongFlash() {
    const f = document.createElement('div');
    f.className = 'mg-wrong-flash';
    document.getElementById('game').appendChild(f);
    setTimeout(()=>f.remove(), 400);
  },

  // --- SPEED BONUS ---
  checkSpeedBonus() {
    if (this.customerPatience > 70) {
      this.score += 50;
      this.toast('SPEED BONUS! +50', 'good');
      return true;
    } else if (this.customerPatience < 30) {
      const roast = R(this.lukeSlowRoasts);
      this.toast('Luke: "' + roast + '"', 'luke');
      return false;
    }
    return null;
  },

  // --- HONK SYSTEM (Drive-through) ---
  startHonking() {
    this.stopHonking();
    this._honkInterval = setInterval(() => {
      if (this.customerPatience < 40) {
        const overlay = document.getElementById('minigame-overlay');
        if (overlay && overlay.classList.contains('visible')) {
          let honk = overlay.querySelector('.honk-text');
          if (!honk) {
            honk = document.createElement('div');
            honk.className = 'honk-text';
            overlay.appendChild(honk);
          }
          honk.textContent = R(['HONK HONK!', 'BEEEEP!', '*HONKING*', 'HOOOONK!']);
          clearTimeout(this._honkFade);
          this._honkFade = setTimeout(() => { if(honk) honk.remove(); }, 1200);
        }
      }
    }, 2500);
  },
  stopHonking() {
    clearInterval(this._honkInterval);
    const honks = document.querySelectorAll('.honk-text');
    honks.forEach(h => h.remove());
  },

  // --- DIALOG ---
  showDialog(charKey, text, choices=[], onDone=null) {
    const box = document.getElementById('dialog');
    const name = this.chars[charKey]?.name || charKey;
    // Draw portrait
    const pc = document.getElementById('dlg-portrait');
    Sprites.drawChar(pc, charKey);

    document.getElementById('dlg-name').textContent = name;
    const textEl = document.getElementById('dlg-text');
    textEl.textContent = '';
    let i = 0;
    const tp = () => { if(i<text.length){ textEl.textContent+=text[i]; i++; setTimeout(tp,16); } };
    tp();

    const ce = document.getElementById('dlg-choices');
    ce.innerHTML = '';
    if (choices.length) {
      choices.forEach(c => {
        const b = document.createElement('button');
        b.className = 'ch-btn';
        b.textContent = c.text;
        b.onclick = () => {
          box.classList.remove('visible');
          if (c.action) c.action();
          else if (c.e !== undefined) {
            if (c.e > 0) { this.score += Math.round(c.e*50); this.toast('Good response! +'+Math.round(c.e*50),'good'); }
            else { this.addStrike(0.5); this.toast('Bad response...','bad'); }
            if(onDone) onDone();
          }
        };
        ce.appendChild(b);
      });
    } else {
      const b = document.createElement('button');
      b.className = 'ch-btn';
      b.textContent = 'Continue';
      b.onclick = () => { box.classList.remove('visible'); if(onDone) onDone(); };
      ce.appendChild(b);
    }
    box.classList.add('visible');
  },

  // --- SCOLD ---
  showScold(title, msg, cb) {
    const o = document.createElement('div');
    o.className = 'scold';
    o.innerHTML = `<h2>${title}</h2><p>${msg}</p><button class="btn btn-r" style="padding:10px 24px;font-size:.85em" id="scold-go">I'm sorry...</button>`;
    document.getElementById('game').appendChild(o);
    o.querySelector('#scold-go').onclick = () => { o.remove(); if(cb) cb(); };
  },

  // --- STRIKES ---
  addStrike(n=1) {
    this.strikes += n;
    this.updateHUD();
    if (this.strikes >= this.maxStrikes) {
      this.getFired("Too many strikes. Management decided to let you go.");
    } else if (this.strikes >= 2) {
      this.showScold("FINAL WARNING!", "Luke: \"Justin, one more mistake and you're done. I can't keep covering for you.\"");
    }
  },

  getFired(reason) {
    this.isRunning = false; this.inMinigame = false;
    this.stopHonking();
    document.getElementById('hud').classList.remove('visible');
    document.getElementById('dialog').classList.remove('visible');
    document.getElementById('minigame-overlay').classList.remove('visible');
    clearInterval(this.patienceTimer);
    document.getElementById('fired-reason').textContent = reason;
    document.getElementById('final-stats').innerHTML = `
      <p>Customers Served <span>${this.customersServed}</span></p>
      <p>Orders Correct <span>${this.ordersCorrect}</span></p>
      <p>Orders Messed Up <span>${this.ordersMessed}</span></p>
      <p>Score <span>${this.score}</span></p>`;
    document.getElementById('fired-screen').classList.add('active');
  },

  // --- APP ---
  toggleApp() {
    const a = document.getElementById('app-screen');
    if (a.classList.contains('active')) { a.classList.remove('active'); return; }
    const s = this.strikes >= this.maxStrikes ? 'dead' : this.strikes >= 2 ? 'bad' : this.strikes >= 1 ? 'warn' : 'ok';
    const st = { ok:'ACTIVE', warn:'ON THIN ICE', bad:'FINAL WARNING', dead:'TERMINATED' }[s];
    document.getElementById('app-body').innerHTML = `
      <div class="stat-card"><h3>Status</h3><span class="stat-badge sb-${s}">${st}</span></div>
      <div class="stat-card"><h3>Score</h3><div class="stat-val">${this.score}</div></div>
      <div class="stat-card"><h3>Strikes</h3><div class="stat-val">${Math.ceil(this.strikes)}/${this.maxStrikes}</div>
        <div class="stat-bar"><div class="stat-bar-f" style="width:${(this.strikes/this.maxStrikes)*100}%;background:var(--danger)"></div></div></div>
      <div class="stat-card"><h3>Customers Served</h3><div class="stat-val">${this.customersServed}</div></div>
      <div class="stat-card"><h3>Accuracy</h3><div class="stat-val">${this.customersServed>0?Math.round((this.ordersCorrect/this.customersServed)*100):0}%</div>
        <div class="stat-bar"><div class="stat-bar-f" style="width:${this.customersServed>0?(this.ordersCorrect/this.customersServed)*100:0}%;background:var(--success)"></div></div></div>
      <div class="stat-card"><h3>Shift Progress</h3><div class="stat-val">${this.currentRound}/${this.totalRounds}</div>
        <div class="stat-bar"><div class="stat-bar-f" style="width:${(this.currentRound/this.totalRounds)*100}%;background:var(--blue)"></div></div></div>`;
    a.classList.add('active');
  },

  // --- ROUNDS ---
  nextRound() {
    if (!this.isRunning) return;
    this.currentRound++;
    if (this.currentRound > this.totalRounds) { this.endShift(); return; }
    this.customerPatience = 100;
    this.inMinigame = false;
    this.isReaganCustomer = false;
    this.patienceDrainRate = 2.2;
    this.updateHUD();

    // === SPECIAL ROUND EVENTS ===
    if (this.currentRound === 3) {
      this.toast('Luke: "Corporate is watching today. Don\'t embarrass me."', 'luke');
    }
    if (this.currentRound === 6) {
      this.patienceDrainRate = 3.3;
      this.toast('LUNCH RUSH! Patience drains 50% faster!', 'chaos');
    }
    if (this.currentRound === 12 && this.isRunning) {
      this.toast('Luke: "I can\'t believe you made it. Genuinely shocked."', 'luke');
    }

    // === CHAOS EVENTS (random between rounds) ===
    if (this.currentRound > 1 && Math.random() < 0.30) {
      this.triggerChaos(() => this.afterChaos());
      return;
    }

    this.afterChaos();
  },

  afterChaos() {
    // Andy event check - round 9 gets double Andy
    const andyRolls = this.currentRound === 9 ? 2 : 1;
    let andyCount = 0;
    for (let i = 0; i < andyRolls; i++) {
      if (this.currentRound > 2 && Math.random() < this.andyChance) {
        andyCount++;
      }
    }

    if (andyCount > 0) {
      const doAndy = (remaining, cb) => {
        if (remaining <= 0) { cb(); return; }
        if (remaining < andyCount) {
          this.toast("Andy is BACK AGAIN?!", 'andy');
        }
        this.andyEvent(() => doAndy(remaining - 1, cb));
      };
      doAndy(andyCount, () => this.assignStation());
    } else {
      this.assignStation();
    }
  },

  triggerChaos(cb) {
    const evt = R(this.chaosEvents);
    this.toast('CHAOS EVENT!', 'chaos');
    setTimeout(() => {
      this.showDialog('justin', evt.intro, [], () => {
        const handlesDialog = evt.effect(cb);
        if (!handlesDialog) {
          this.showDialog('luke', evt.lukeReaction, [], cb);
        }
      });
    }, 600);
  },

  assignStation() {
    const stations = ['register','bagging','curbside','ipad','drivethrough'];
    this.availableStation = stations[Math.floor(Math.random()*stations.length)];
    this.toast(`Luke: "Justin! Head to ${Restaurant.stations[this.availableStation].label}!"`, 'luke');
  },

  arriveAtStation(station) {
    if (station !== this.availableStation) {
      this.toast("WRONG STATION! Luke said " + Restaurant.stations[this.availableStation]?.label + "!", 'bad');
      this.addStrike(0.25);
      return;
    }
    this.availableStation = null;
    this.inMinigame = true;
    const customer = this.pickCustomer();

    // Patience drain
    clearInterval(this.patienceTimer);
    this.patienceTimer = setInterval(() => {
      this.customerPatience = Math.max(0, this.customerPatience - this.patienceDrainRate);
      this.updateHUD();
      this.updateTimerDisplay();
      if (this.customerPatience <= 0) {
        clearInterval(this.patienceTimer);
        this.stopHonking();
        this.failMG("Customer lost patience and left!");
      }
    }, 500);

    switch(station) {
      case 'register': this.mgRegister(customer); break;
      case 'bagging': this.mgBagging(customer); break;
      case 'curbside': this.mgCurbside(customer); break;
      case 'ipad': this.mgIPad(customer); break;
      case 'drivethrough': this.mgDriveThrough(customer); break;
    }
  },

  pickCustomer() {
    // Round 11 guarantees Reagan
    if (this.currentRound === 11) {
      const orders = this.npcOrders['reagan'];
      const order = orders[Math.floor(Math.random()*orders.length)];
      return { key:'reagan', name:'Reagan', order };
    }

    const keys = Object.keys(this.npcOrders);
    const k = keys[Math.floor(Math.random()*keys.length)];
    const orders = this.npcOrders[k];
    const order = orders[Math.floor(Math.random()*orders.length)];
    return { key:k, name:this.chars[k]?.name||k, order };
  },

  // --- REAGAN DYNAMICS ---
  getReaganGreeting(cust) {
    if (cust.key !== 'reagan') return cust.order.greeting;
    this.isReaganCustomer = true;
    return cust.order.greeting;
  },

  getReaganFlustered() {
    return R([
      "Uh... hi Reagan... what can I... you look— I MEAN what can I get you",
      "Hey! Reagan! Hi! Welcome to— you already know where you are. What can I— yeah.",
      "Oh! Reagan! Didn't expect— I mean of COURSE you can come here whenever— what would you like?",
      "*voice cracks* Hey Reagan! What can I get for— *clears throat* sorry, what can I get you?",
    ]);
  },

  reaganPostOrderDialog(cb) {
    this.showDialog('justin', R([
      "Did she just smile at me? Was that a real smile? FOCUS JUSTIN.",
      "Okay. Be cool. She's just a customer. A really pretty customer. WHO I AM NOT THINKING ABOUT AT WORK.",
      "My hands are shaking. Why are my hands shaking. It's a REGISTER, Justin. You've used it a thousand times.",
      "She said 'thanks Justin' and my brain just... stopped. For like 3 full seconds.",
    ]), [], () => {
      this.showDialog('luke', R(this.lukeReaganRoasts), [], cb);
    });
  },

  reaganFailDialog(cb) {
    this.showDialog('justin', R([
      "Oh no... oh no no no... not HER order...",
      "I messed up REAGAN'S order. Of all the orders. REAGAN'S.",
      "She's going to think I'm an idiot. I AM an idiot. But she doesn't need to KNOW that.",
      "I'm going to think about this at 3 AM for the rest of my life.",
    ]), [], () => {
      this.showDialog('reagan', R([
        "It's okay Justin, really! These things happen. *smiles reassuringly*",
        "Don't worry about it! I know you're busy. It's totally fine!",
        "Hey, no big deal! You're doing great. Seriously.",
      ]), [], () => {
        this.showDialog('luke', R([
          "She's being nice about it which somehow makes this WORSE for you, doesn't it?",
          "The look on your face right now... I almost feel bad for you. Almost.",
          "Reagan handled that better than you handle literally anything.",
        ]), [], cb);
      });
    });
  },

  // --- NPC FLAVOR DIALOGS ---
  npcFlavorDialog(cust, cb) {
    const order = cust.order;
    // Navaneeth mid-order change
    if (order.navFlavor && Math.random() < 0.5) {
      this.showDialog('navaneeth', R([
        "WAIT NO CHANGE THE FRIES TO MAC AND CHEESE WAIT NO KEEP THE FRIES AND ADD MAC AND CHEESE",
        "ACTUALLY HOLD ON. Add strips. WAIT I ALREADY SAID THAT. Did I?? WHATEVER JUST ADD EVERYTHING.",
        "YO WAIT. Is the milkshake machine working? IT BETTER BE. Actually give me TWO milkshakes. WAIT no, one milkshake one lemonade. FINAL ANSWER.",
      ]), [], cb);
      return true;
    }
    // Katy holds up the line
    if (order.katyFlavor && Math.random() < 0.6) {
      this.customerPatience = Math.max(0, this.customerPatience - 10);
      this.updateHUD();
      this.showDialog('katy', R([
        "OH WAIT before you ring that up, did I tell you about what happened at practice?? So basically— actually never mind order first. OR ACTUALLY wait this is really quick—",
        "Okay so I KNOW there's a line but this will only take a second— so you know how Gentry was saying— oh the people behind me look mad. FINE. Ring it up. But I'm telling you after!!",
      ]), [], cb);
      return true;
    }
    // Coach Hudson judges form
    if (order.hudsonFlavor && Math.random() < 0.5) {
      this.showDialog('hudson', R([
        "Cook, your posture at that register is TERRIBLE. Shoulders BACK. Core ENGAGED. You ring up food like you run — sloppy.",
        "Stand up straight, Cook! I can see your form breaking down from here. This is why your 5K time is stagnant.",
        "Cook! What are you doing with your arms?? That's the same lazy motion I see at mile 3 when you give up.",
      ]), [], cb);
      return true;
    }
    // Black & Carter argue
    if (order.blackCarterFlavor && Math.random() < 0.6) {
      const arguer = cust.key === 'black' ? 'carter' : 'black';
      this.showDialog(arguer, R([
        "Nah nah nah, change mine to a spicy deluxe. Actually Justin, who do you think has better taste?? Don't answer that.",
        "Justin tell him the nuggets are better than strips. TELL HIM. Actually just get both I don't care anymore.",
        "This man has been arguing with me for 20 minutes about SAUCE. Justin just give us one of everything.",
      ]), [], cb);
      return true;
    }
    // Henry shows memes
    if (order.henryFlavor && Math.random() < 0.5) {
      this.customerPatience = Math.max(0, this.customerPatience - 8);
      this.updateHUD();
      this.showDialog('henry', R([
        "*shoves phone in Justin's face* BRO YOU GOTTA SEE THIS. Wait let me find it. Hold on. It was so funny. Where did it— OH HERE. LOOK. *it's a picture of a chicken at a track meet* GET IT? BECAUSE YOU RUN AND WORK AT—",
        "Justin. Justin. Look at this meme real quick. *shows phone* That's literally you at work. LITERALLY. Okay now take my order lol.",
      ]), [], () => {
        this.toast("Henry distracted you! -8 patience", 'warn');
        cb();
      });
      return true;
    }
    // Gentry complex vibes
    if (order.gentryFlavor && order.items.length > 5 && Math.random() < 0.4) {
      this.showDialog('gentry', R([
        "Yeah I know it's a lot. I'm a complex person, Justin. Don't judge me.",
        "Before you give me that look — yes I need all of it. Practice was FOUR hours today.",
      ]), [], cb);
      return true;
    }
    return false;
  },

  openMG(title, inst) {
    const o = document.getElementById('minigame-overlay');
    document.getElementById('mg-title').textContent = title;
    document.getElementById('mg-inst').textContent = inst;
    document.getElementById('mg-area').innerHTML = '';
    document.getElementById('mg-timer-wrap').innerHTML = '';
    o.classList.add('visible');
    return document.getElementById('mg-area');
  },

  closeMG() {
    document.getElementById('minigame-overlay').classList.remove('visible');
    document.getElementById('mg-timer-wrap').innerHTML = '';
    this.stopHonking();
  },

  // ============================
  //  REGISTER MINIGAME (CFA POS)
  // ============================
  mgRegister(cust) {
    let entered = [];
    const items = cust.order.items;
    let activeCat = 'entree';
    const cats = {entree:'Entrees',side:'Sides',bev:'Beverages',dessert:'Desserts'};
    const orderNum = Math.floor(Math.random()*900)+100;
    const isReagan = cust.key === 'reagan';

    const greetingText = isReagan ? this.getReaganFlustered() : cust.order.greeting;

    this.showDialog(cust.key, greetingText, [
      { text: isReagan ? "Uh... welcome to... yeah. Go ahead." : "Welcome to Chick-fil-A! Go ahead.", action: () => {
        if (isReagan) {
          this.reaganPostOrderDialog(() => render());
        } else {
          // NPC flavor check
          if (!this.npcFlavorDialog(cust, () => render())) {
            render();
          }
        }
      }},
      { text: isReagan ? "*stammering* My... my pleasure... what can I..." : "My pleasure, what can I get you?", action: () => {
        if (isReagan) {
          this.reaganPostOrderDialog(() => render());
        } else {
          if (!this.npcFlavorDialog(cust, () => render())) {
            render();
          }
        }
      }},
    ]);

    const render = () => {
      // Navaneeth special: show his reaction to the size
      if (cust.key === 'navaneeth' && items.length > 7) {
        this.toast(R(this.lukeNavRoasts), 'luke');
      }

      const area = this.openMG('REGISTER', `Order #${orderNum} for ${cust.name}`);
      const wrap = document.createElement('div');
      wrap.className = 'reg-screen';
      wrap.innerHTML = `
        <div class="reg-header"><h3>Chick-fil-A POS</h3><span class="order-num">Order #${orderNum}</span></div>
        <div class="reg-display" id="rd"><span class="reg-empty">No items entered...</span></div>
        <div class="reg-total" id="rtotal"><span>Items: 0</span><span>Needed: ${items.length}</span></div>
        <div class="reg-cats" id="rcats"></div>
        <div class="menu-grid" id="rm"></div>
        <div class="reg-acts">
          <button class="btn btn-r" id="rc">VOID</button>
          <button class="btn" style="background:var(--success);color:#fff" id="rs">SEND ORDER</button>
        </div>`;
      area.appendChild(wrap);

      // Build category tabs
      const catsEl = document.getElementById('rcats');
      Object.entries(cats).forEach(([k,v]) => {
        const tab = document.createElement('div');
        tab.className = `reg-cat ${k===activeCat?'active':''}`;
        tab.textContent = v;
        tab.onclick = () => { activeCat = k; renderMenu(); document.querySelectorAll('.reg-cat').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); };
        catsEl.appendChild(tab);
      });

      const renderMenu = () => {
        const grid = document.getElementById('rm');
        grid.innerHTML = '';
        this.menu.filter(m=>m.cat===activeCat).forEach(m => {
          const b = document.createElement('div');
          b.className = 'menu-btn';
          b.innerHTML = `<span class="mi"></span>${m.name}`;
          b.onclick = () => { entered.push(m.id); updDisp(); };
          grid.appendChild(b);
        });
      };
      renderMenu();

      const updDisp = () => {
        const d = document.getElementById('rd');
        const t = document.getElementById('rtotal');
        if (!entered.length) { d.innerHTML = '<span class="reg-empty">No items entered...</span>'; }
        else { d.innerHTML = entered.map(id=>{const m=this.menu.find(x=>x.id===id);return `<div class="reg-item"><span>${m?.name||id}</span><span>1</span></div>`;}).join(''); }
        t.innerHTML = `<span>Items: ${entered.length}</span><span style="color:${entered.length===items.length?'var(--success)':entered.length>items.length?'var(--danger)':'#333'}">Needed: ${items.length}</span>`;
      };
      document.getElementById('rc').onclick = () => { entered=[]; updDisp(); };
      document.getElementById('rs').onclick = () => {
        clearInterval(this.patienceTimer);
        this.closeMG();
        const ok = [...items].sort().join() === [...entered].sort().join();
        this.customersServed++;
        if (ok) {
          this.ordersCorrect++; this.score += 100+Math.round(this.customerPatience);
          this.toast('Order correct! +'+(100+Math.round(this.customerPatience)),'good');
          this.checkSpeedBonus();
          if (isReagan) {
            this.showDialog('justin', "She ordered. I got it right. I'm basically a hero.", [], ()=>this.nextRound());
          } else {
            this.showDialog('luke', R(this.lukeGood), [], ()=>this.nextRound());
          }
        } else {
          this.ordersMessed++;
          if (isReagan) {
            this.reaganFailDialog(() => { this.addStrike(0.75); this.nextRound(); });
          } else {
            this.toast('Wrong order sent!','bad');
            const roasts = items.length <= 3 ? this.lukeSimpleFailRoasts : this.lukeRoasts;
            this.showDialog(cust.key, R(this.angryLines), this.angryChoices.map(c=>({text:c.text,action:()=>{
              if(c.e>0){this.score+=Math.round(c.e*30);}else{this.addStrike(0.25);}
              this.showDialog('luke',R(roasts),[],()=>{this.addStrike(0.75);this.nextRound();});
            }})));
          }
        }
        this.updateHUD();
      };
    };
  },

  // ============================
  //  BAGGING MINIGAME
  // ============================
  mgBagging(cust) {
    let picked = [];
    const items = cust.order.items;
    const correct = items.map(id=>this.menu.find(m=>m.id===id));
    const wrong = this.menu.filter(m=>!items.includes(m.id)).sort(()=>Math.random()-.5).slice(0,4);
    const all = [...correct,...wrong].sort(()=>Math.random()-.5);
    const isReagan = cust.key === 'reagan';

    const introText = isReagan
      ? `Justin! Reagan's order is up. Your hands are shaking. Bag it correctly. Don't you DARE mess this one up.`
      : `Justin! ${cust.name}'s order is up. Bag it correctly. Jacob already made it. Don't mess this up.`;

    this.showDialog('luke', introText, [
      { text: isReagan ? "Oh no. Oh no oh no..." : "On it!", action:()=>render() },
    ]);

    const render = () => {
      const area = this.openMG('BAGGING', `Bag order for ${cust.name}`);
      const w = document.createElement('div');
      w.className = 'bag-wrap';
      w.innerHTML = `<div class="bag-ticket"><strong>Order:</strong> ${items.map(id=>this.menu.find(m=>m.id===id)?.short||id).join(', ')}</div><div class="conveyor" id="conv"></div><div class="bag-drop" id="bdrop"></div><div class="reg-acts" style="margin-top:12px"><button class="btn btn-r" style="font-size:.78em" id="brst">Reset</button><button class="btn" style="background:var(--success);color:#fff;font-size:.78em" id="bsub">Deliver Bag</button></div>`;
      area.appendChild(w);

      const conv = document.getElementById('conv');
      all.forEach((item,idx) => {
        const d = document.createElement('div');
        d.className = 'food-box';
        d.textContent = item.short;
        d.onclick = () => {
          if(d.classList.contains('picked')){
            d.classList.remove('picked');
            picked=picked.filter(p=>p.idx!==idx);
          } else {
            // WRONG ITEM flash check
            if (!items.includes(item.id)) {
              d.classList.add('wrong-pick');
              this.wrongFlash();
              this.toast('WRONG ITEM!', 'bad');
              setTimeout(() => d.classList.remove('wrong-pick'), 500);
              return; // don't add it, just warn
            }
            d.classList.add('picked');
            picked.push({id:item.id,idx});
          }
          updBag();
        };
        conv.appendChild(d);
      });

      const updBag = () => {
        document.getElementById('bdrop').innerHTML = picked.map(p=>`<span class="bag-mini">${this.menu.find(m=>m.id===p.id)?.short||''}</span>`).join('');
      };

      document.getElementById('brst').onclick = () => { picked=[]; document.querySelectorAll('.food-box').forEach(f=>f.classList.remove('picked')); updBag(); };
      document.getElementById('bsub').onclick = () => {
        clearInterval(this.patienceTimer);
        this.closeMG();
        const ok = [...items].sort().join() === picked.map(p=>p.id).sort().join();
        this.customersServed++;
        if(ok){
          this.ordersCorrect++; this.score+=120+Math.round(this.customerPatience);
          this.toast('Bagged perfectly! +'+(120+Math.round(this.customerPatience)),'good');
          this.checkSpeedBonus();
          if (isReagan) {
            this.showDialog('reagan', R(["Thanks Justin! *smiles*","Perfect, thank you! See you later!","You're the best, Justin!"]), [], () => {
              this.showDialog('justin', "She said I'm the best. SHE SAID I'M THE BEST.", [], ()=>this.nextRound());
            });
          } else {
            this.showDialog(cust.key, R(["Thanks! Perfect order!","That's everything, thanks!","Awesome, appreciate it!"]), [], ()=>this.nextRound());
          }
        } else {
          this.ordersMessed++; this.toast('Wrong items in the bag!','bad');
          if (isReagan) {
            this.reaganFailDialog(() => { this.addStrike(0.75); this.nextRound(); });
          } else {
            this.showDialog('luke', R(this.lukeRoasts), [], ()=>{ this.addStrike(0.75); this.nextRound(); });
          }
        }
        this.updateHUD();
      };
    };
  },

  // ============================
  //  CURBSIDE MINIGAME
  // ============================
  mgCurbside(cust) {
    const spots = [];
    const nk = Object.keys(this.npcOrders);
    const correct = Math.floor(Math.random()*6);
    const isReagan = cust.key === 'reagan';
    for(let i=0;i<6;i++){
      if(i===correct) spots.push({occ:true,name:cust.name,right:true,car:R(['Sedan','SUV','Truck','Van','Coupe'])});
      else if(Math.random()>.4){const k=nk[Math.floor(Math.random()*nk.length)];spots.push({occ:true,name:this.chars[k]?.name||'Customer',right:false,car:R(['Sedan','SUV','Truck','Hatch'])});}
      else spots.push({occ:false});
    }

    const introText = isReagan
      ? `Reagan is waiting in the parking lot. Find her car. Your hands are sweating, Justin. Get it together.`
      : `${cust.name} is waiting in the lot. Find their car and deliver. Don't give it to the wrong person... again.`;

    this.showDialog('luke', introText, [
      { text: isReagan ? "Reagan's out there?? I mean— yeah I'll find her." : "I'll find them!", action:()=>render() },
    ]);

    const render = () => {
      const area = this.openMG('CURBSIDE DELIVERY', `Find ${cust.name}'s car!`);
      const g = document.createElement('div');
      g.className = 'park-grid';
      spots.forEach((sp,idx) => {
        const d = document.createElement('div');
        d.className = `park-spot ${sp.occ?'has-car':''}`;
        if(sp.occ){
          d.innerHTML = `<span class="car">${R(['[CAR]','[SUV]','[VAN]'])}</span><span class="pname">${sp.name}</span><span class="pnum">Spot ${idx+1} - ${sp.car}</span>`;
          d.onclick = () => {
            clearInterval(this.patienceTimer);
            this.closeMG();
            this.customersServed++;
            if(sp.right){
              this.ordersCorrect++; this.score+=80+Math.round(this.customerPatience);
              this.toast('Delivered! +'+(80+Math.round(this.customerPatience)),'good');
              this.checkSpeedBonus();
              if (isReagan) {
                this.showDialog('reagan', R(["Hey Justin! Thanks for bringing it out! *waves*","You found me! Thank you!","Justin! You're so sweet, thanks!"]), [], () => {
                  this.showDialog('justin', "She waved at me. I'm going to pass out.", [], ()=>this.nextRound());
                });
              } else {
                this.showDialog(cust.key, R(["Thanks Justin!","Perfect, thanks!","That was fast!"]), [], ()=>this.nextRound());
              }
            } else {
              this.ordersMessed++; this.toast('Wrong car!','bad');
              if (isReagan) {
                this.reaganFailDialog(() => { this.addStrike(1.5); this.nextRound(); });
              } else {
                this.showDialog('luke', `You gave ${cust.name}'s food to ${sp.name}. HOW.`, [], ()=>{ this.addStrike(1.5); this.nextRound(); });
              }
            }
            this.updateHUD();
          };
        } else {
          d.innerHTML = `<span class="pnum">Empty</span><span style="font-size:1.2em;opacity:.3">P</span>`;
        }
        g.appendChild(d);
      });
      area.appendChild(g);
    };
  },

  // ============================
  //  OUTSIDE iPAD MINIGAME
  // ============================
  mgIPad(cust) {
    let entered = [];
    const items = cust.order.items;
    const weather = R(['94F - Hot out here','62F - Rainy','78F - Cloudy','101F - Scorching','55F - Windy']);
    const carNum = Math.floor(Math.random()*30)+1;
    const isReagan = cust.key === 'reagan';

    const introText = isReagan
      ? `Wait... is that Reagan in the drive-through line? Get outside with the iPad. Car #${carNum}. Justin. BREATHE.`
      : `Get outside with the iPad. Line of cars wrapped around. ${cust.name} is car #${carNum}. Take their order.`;

    this.showDialog('luke', introText, [
      { text: isReagan ? "Reagan drives through here??" : "Heading out!", action:()=>render() },
      { text:"Can't Jacob do it?", action:()=>{ this.toast("Luke: Jacob MAKES the food. GO.",'luke'); setTimeout(()=>render(),1200); }},
    ]);

    const render = () => {
      const greetText = isReagan ? this.getReaganFlustered() + " ...through the car window. While holding an iPad. In the sun." : cust.order.greeting;
      const area = this.openMG('OUTSIDE iPAD ORDER', `Car #${carNum} - ${weather}`);
      const f = document.createElement('div');
      f.className = 'ipad-frame';
      f.innerHTML = `<div class="ipad-inner"><div class="ipad-top"><h3>CFA Order System</h3><span class="car-tag">Car #${carNum}</span></div><div class="ipad-bubble">${greetText}</div><div class="ipad-entered" id="ie">Tap items to add...</div><div class="ipad-grid" id="ig"></div><div class="reg-acts"><button class="btn btn-r" style="font-size:.75em" id="ic">Clear</button><button class="btn" style="background:var(--success);color:#fff;font-size:.75em" id="is">Send to Kitchen</button></div></div>`;
      area.appendChild(f);

      const grid = document.getElementById('ig');
      this.menu.forEach(m => {
        const b = document.createElement('div');
        b.className = 'ipad-item';
        b.textContent = m.short;
        b.onclick = () => { entered.push(m.id); updIpad(); };
        grid.appendChild(b);
      });

      const updIpad = () => {
        const el = document.getElementById('ie');
        el.innerHTML = entered.length ? entered.map(id=>`<span class="ipad-chip">${this.menu.find(m=>m.id===id)?.short||id}</span>`).join('') : 'Tap items to add...';
      };

      document.getElementById('ic').onclick = () => { entered=[]; updIpad(); };
      document.getElementById('is').onclick = () => {
        clearInterval(this.patienceTimer);
        this.closeMG();
        const ok = [...items].sort().join() === [...entered].sort().join();
        this.customersServed++;
        if(ok){
          this.ordersCorrect++; this.score+=110+Math.round(this.customerPatience);
          this.toast('Order sent to Jacob! +'+(110+Math.round(this.customerPatience)),'good');
          this.checkSpeedBonus();
          if (isReagan) {
            this.showDialog('reagan', "Thanks Justin! Stay cool out here!", [], () => {
              this.showDialog('justin', "She told me to stay cool. I am NOT cool. I am the opposite of cool right now.", [], ()=>this.nextRound());
            });
          } else {
            this.showDialog('luke', R(this.lukeGood), [], ()=>this.nextRound());
          }
        } else {
          this.ordersMessed++;
          if (isReagan) {
            this.reaganFailDialog(() => { this.addStrike(0.75); this.nextRound(); });
          } else {
            this.toast('Wrong order sent to kitchen!','bad');
            this.showDialog('luke', R(["Jacob yelled at me because that order makes no sense.","The iPad order is all wrong!","Did the heat get to your brain?"]), [], ()=>{ this.addStrike(0.75); this.nextRound(); });
          }
        }
        this.updateHUD();
      };
    };
  },

  // ============================
  //  DRIVE-THROUGH WINDOW
  // ============================
  mgDriveThrough(cust) {
    let handed = [];
    const items = cust.order.items;
    const correct = items.map(id=>this.menu.find(m=>m.id===id));
    const wrong = this.menu.filter(m=>!items.includes(m.id)).sort(()=>Math.random()-.5).slice(0,3);
    const tray = [...correct,...wrong].sort(()=>Math.random()-.5);
    const isReagan = cust.key === 'reagan';

    const introText = isReagan
      ? `Drive-through window! Reagan is pulling up. Do NOT make it weird, Justin.`
      : `Drive-through window! ${cust.name} pulling up. Hand them the RIGHT items. Do NOT give them someone else's food.`;

    this.showDialog('luke', introText, [
      { text: isReagan ? "It's just a window. I can do this. Maybe." : "Window time!", action:()=>render() },
    ]);

    const render = () => {
      this.startHonking();
      const area = this.openMG('DRIVE-THROUGH WINDOW', `Hand ${cust.name} their order`);
      const w = document.createElement('div');
      w.className = 'dt-wrap';
      const sayText = isReagan
        ? R(["Hi Justin! *waves from car*", "Hey! It's me!", "Justin! Fancy seeing you here *laughs*"])
        : R(["Mobile order for "+cust.name,"Picking up!","Hey, order ready?","What's up Justin!"]);
      w.innerHTML = `<div class="dt-window"><div class="dt-car">${R(['[CAR]','[SUV]','[TRUCK]','[VAN]'])}</div><div class="dt-who">${cust.name}</div><div class="dt-says">"${sayText}"</div></div><div class="dt-counter"><div class="dt-ticket"><strong>Ticket:</strong> ${items.map(id=>this.menu.find(m=>m.id===id)?.short||id).join(', ')}</div><div class="dt-handed" id="dh"></div><div class="dt-tray" id="dtray"></div><div class="reg-acts"><button class="btn btn-r" style="font-size:.75em" id="drst">Take Back</button><button class="btn" style="background:var(--success);color:#fff;font-size:.75em" id="ddn">Close Window</button></div></div>`;
      area.appendChild(w);

      const dtray = document.getElementById('dtray');
      tray.forEach((item,idx) => {
        const d = document.createElement('div');
        d.className = 'dt-item';
        d.textContent = item.short;
        d.onclick = () => { if(d.classList.contains('gone'))return; d.classList.add('gone'); handed.push({id:item.id,idx}); updH(); };
        dtray.appendChild(d);
      });

      const updH = () => {
        document.getElementById('dh').innerHTML = handed.map(h=>`<span class="dt-hchip">${this.menu.find(m=>m.id===h.id)?.short||''}</span>`).join('');
      };

      document.getElementById('drst').onclick = () => { handed=[]; document.querySelectorAll('.dt-item').forEach(d=>d.classList.remove('gone')); updH(); };
      document.getElementById('ddn').onclick = () => {
        clearInterval(this.patienceTimer);
        this.closeMG();
        this.stopHonking();
        const ok = [...items].sort().join() === handed.map(h=>h.id).sort().join();
        this.customersServed++;
        if(ok){
          this.ordersCorrect++; this.score+=90+Math.round(this.customerPatience);
          this.toast('Perfect handoff! +'+(90+Math.round(this.customerPatience)),'good');
          this.checkSpeedBonus();
          if (isReagan) {
            this.showDialog('reagan', R(["Thanks Justin! *smiles and drives away*","You're a lifesaver! See you around!","Perfect! Bye Justin! *waves*"]), [], () => {
              this.showDialog('justin', "I handed Reagan food through a window and our hands almost touched. I need to sit down.", [], ()=>this.nextRound());
            });
          } else {
            this.showDialog(cust.key, R(["Thanks! Have a great day!","Perfect, everything's here!","Fast service, thanks!"]), [], ()=>this.nextRound());
          }
        } else {
          this.ordersMessed++; this.toast('Wrong items!','bad');
          if (isReagan) {
            this.reaganFailDialog(() => { this.addStrike(0.75); this.nextRound(); });
          } else {
            this.showDialog(cust.key, R(["This isn't what I ordered??","I'm missing stuff!","Bro I can see my items right there on the counter."]),
              this.angryChoices.map(c=>({text:c.text,action:()=>{
                if(c.e>0){this.score+=Math.round(c.e*50);}else{this.addStrike(0.25);}
                this.showDialog('luke',R(this.lukeRoasts),[],()=>{this.addStrike(0.75);this.nextRound();});
              }})));
          }
        }
        this.updateHUD();
      };
    };
  },

  // --- ANDY ---
  andyEvent(cb) {
    this.toast('ANDY ALERT! Andy has entered the building!','andy');
    const a = R(this.andyAllegations);
    setTimeout(()=>{
      this.showDialog('andy', `Hey! Manager! ${a.claim}`, [], ()=>{
        // Special follow-up for napkin allegation
        const followup = a.lukeFollowup
          ? `Justin... Andy is saying stuff. Care to explain? Also... ${a.lukeFollowup}`
          : "Justin... Andy is saying stuff. Care to explain?";
        this.showDialog('luke', followup,
          a.defenses.map(d=>({
            text:d.text,
            action:()=>{
              if(d.e>0){
                this.score+=Math.round(d.e*40);
                this.toast('Defended yourself! Andy leaves.','good');
                this.showDialog('luke', R(["Yeah Andy, get out. Justin's fine.","You don't even work here, Andy!","Nice try Andy."]), [], () => {
                  // Post-Andy Luke roast
                  if (Math.random() < 0.5) {
                    this.toast(R(this.lukePostAndyRoasts), 'luke');
                  }
                  cb();
                });
              } else {
                this.addStrike(0.75);
                this.toast("That defense didn't help... +0.75 strike",'bad');
                this.showDialog('luke', R(this.lukePostAndyRoasts), [], cb);
              }
            }
          }))
        );
      });
    }, 800);
  },

  // --- FAIL ---
  failMG(reason) {
    this.closeMG();
    this.customersServed++; this.ordersMessed++;
    this.toast(reason,'bad');
    this.addStrike(1.5);
    if(this.isRunning) this.showDialog('luke', R(this.lukeRoasts), [], ()=>this.nextRound());
    this.updateHUD();
  },

  // --- END SHIFT ---
  endShift() {
    clearInterval(this.patienceTimer);
    this.isRunning = false; this.inMinigame = false;
    this.stopHonking();
    document.getElementById('hud').classList.remove('visible');
    document.getElementById('dialog').classList.remove('visible');
    this.closeMG();
    if(this.strikes>=this.maxStrikes){this.getFired("Disastrous shift. Stick to running, Justin.");return;}
    const acc = this.customersServed>0?Math.round((this.ordersCorrect/this.customersServed)*100):0;
    const area = document.getElementById('mg-area');
    document.getElementById('minigame-overlay').classList.add('visible');
    document.getElementById('mg-title').textContent = 'SHIFT COMPLETE!';
    document.getElementById('mg-inst').textContent = 'You survived! Barely.';
    area.innerHTML = `<div style="width:100%;max-width:320px;background:#222;border-radius:14px;padding:20px;margin-top:20px">
      <p style="display:flex;justify-content:space-between;padding:6px 0;color:#fff;font-size:.9em"><span>Score</span><strong>${this.score}</strong></p>
      <p style="display:flex;justify-content:space-between;padding:6px 0;color:#fff;font-size:.9em"><span>Served</span><strong>${this.customersServed}</strong></p>
      <p style="display:flex;justify-content:space-between;padding:6px 0;color:#fff;font-size:.9em"><span>Accuracy</span><strong>${acc}%</strong></p>
      <p style="display:flex;justify-content:space-between;padding:6px 0;color:#fff;font-size:.9em"><span>Strikes</span><strong>${Math.ceil(this.strikes)}/${this.maxStrikes}</strong></p>
      <p style="display:flex;justify-content:space-between;padding:6px 0;color:#0f0;font-size:.9em"><span>Status</span><strong>SURVIVED</strong></p>
    </div><button class="btn btn-w" style="margin-top:20px" onclick="G.closeMG();G.restart()">Play Again</button>`;
  },
};

function R(a){return a[Math.floor(Math.random()*a.length)];}

// --- BOOT ---
window.addEventListener('load', () => {
  Restaurant.init();
  Restaurant.loop();
  // Draw title screen Justin
  const tc = document.getElementById('title-justin');
  if (tc) Sprites.drawChar(tc, 'justin');
});

// Prevent zoom
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<300)e.preventDefault();lt=n;},{passive:false});
</script>
</body>
</html>
