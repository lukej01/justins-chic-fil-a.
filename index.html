<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E51636">
<title>Justin's Chick-fil-A Shift</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--red:#E51636;--dkred:#C41230;--blue:#004F71;--cream:#FFF5E1;--brown:#8B4513;--danger:#FF3333;--success:#28A745;--warn:#FFC107}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:#1a1a2e;touch-action:manipulation}
#game{width:100%;height:100%;position:relative;overflow:hidden;max-width:500px;margin:0 auto;background:#888}
canvas{display:block;width:100%;height:100%}

/* Screens */
.screen{display:none;width:100%;height:100%;position:absolute;top:0;left:0;flex-direction:column;z-index:10}
.screen.active{display:flex}
#title-screen{background:linear-gradient(180deg,var(--red) 0%,#B01030 60%,#8B0A20 100%);align-items:center;justify-content:center;text-align:center;color:#fff}
#title-screen .logo{font-family:'Fredoka One',cursive;font-size:2.2em;line-height:1.1;text-shadow:3px 3px 0 rgba(0,0,0,.3);margin-bottom:6px}
#title-screen .sub{font-size:.85em;opacity:.85;font-weight:700;letter-spacing:1px}
.title-char{width:120px;height:160px;margin:20px auto;position:relative}
.btn{padding:14px 44px;border:none;border-radius:50px;font-family:'Nunito',sans-serif;font-weight:800;font-size:1em;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn-w{background:#fff;color:var(--red);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.btn-r{background:var(--danger);color:#fff}
#start-btn{margin-top:24px}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;height:44px;z-index:100;background:rgba(20,20,35,.8);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:space-between;padding:0 12px;color:#fff;font-weight:700;font-size:.72em;border-bottom:1px solid rgba(255,255,255,.08)}
#hud.visible{display:flex}
.hud-g{display:flex;align-items:center;gap:6px}
#patience-wrap{width:50px;height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
#patience-fill{height:100%;background:var(--success);border-radius:3px;transition:width .3s,background .3s;width:100%}
#app-btn{background:#fff;color:var(--red);border:none;padding:3px 8px;border-radius:8px;font-weight:800;font-size:.7em;font-family:'Nunito',sans-serif;cursor:pointer}

/* Dialog */
#dialog{display:none;position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -6px 32px rgba(0,0,0,.25);padding:18px;z-index:200;max-height:55vh;overflow-y:auto;animation:slideU .25s ease-out}
#dialog.visible{display:block}
#dialog::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:4px;background:#ddd;border-radius:2px}
@keyframes slideU{from{transform:translateY(100%)}to{transform:translateY(0)}}
.dlg-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dlg-portrait{width:40px;height:52px;border-radius:6px;overflow:hidden;flex-shrink:0;position:relative}
.dlg-name{font-weight:800;font-size:.9em;color:var(--red)}
.dlg-text{font-size:.85em;line-height:1.45;color:#333;margin-bottom:12px}
.dlg-choices{display:flex;flex-direction:column;gap:6px}
.ch-btn{width:100%;padding:12px;border:2px solid #eee;border-radius:12px;background:#fff;text-align:left;font-family:'Nunito',sans-serif;font-weight:700;font-size:.82em;color:#333;cursor:pointer;transition:all .15s}
.ch-btn:active{background:var(--red);color:#fff;border-color:var(--red)}

/* Toast */
.toast{position:absolute;top:54px;left:12px;right:12px;padding:12px;border-radius:12px;color:#fff;font-weight:700;font-size:.8em;z-index:300;animation:tIn .3s ease-out,tOut .3s ease-in 2s forwards;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast-good{background:var(--success)}.toast-bad{background:var(--danger)}.toast-warn{background:var(--warn);color:#333}.toast-andy{background:#6f42c1}.toast-luke{background:var(--blue)}.toast-chaos{background:#FF6F00}
@keyframes tIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes tOut{from{opacity:1}to{opacity:0;transform:translateY(-20px)}}

/* Station Labels */
.station-label{position:absolute;background:rgba(0,0,0,.65);color:#fff;padding:3px 8px;border-radius:6px;font-size:.6em;font-weight:800;white-space:nowrap;pointer-events:none;z-index:50;text-align:center;letter-spacing:.5px}
.station-glow{position:absolute;border-radius:8px;border:2px solid rgba(255,255,255,.5);pointer-events:none;z-index:5;animation:glow 1.5s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(255,255,255,.3)}50%{box-shadow:0 0 18px rgba(255,255,255,.7)}}

/* Minigame Overlay */
#minigame-overlay{display:none;position:absolute;inset:0;z-index:150;background:linear-gradient(180deg,rgba(20,20,35,.95),rgba(10,10,20,.98));flex-direction:column;padding:52px 12px 12px;backdrop-filter:blur(8px)}
#minigame-overlay.visible{display:flex}
.mg-title{font-family:'Fredoka One',cursive;font-size:1.2em;color:#fff;text-align:center;margin-bottom:4px;text-shadow:0 2px 8px rgba(229,22,54,.4)}
.mg-inst{font-size:.78em;color:rgba(255,255,255,.6);text-align:center;margin-bottom:12px;font-weight:600}
.mg-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding-bottom:20px}

/* MG Timer */
.mg-timer{font-family:'Fredoka One',cursive;font-size:1.1em;color:#fff;text-align:center;margin-bottom:6px;padding:4px 16px;border-radius:20px;display:inline-block}
.mg-timer.timer-ok{background:rgba(40,167,69,.3);color:#4f4}
.mg-timer.timer-warn{background:rgba(255,193,7,.3);color:#FFC107}
.mg-timer.timer-crit{background:rgba(255,51,51,.4);color:#f55;animation:timerPulse .5s ease-in-out infinite}
@keyframes timerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.mg-wrong-flash{position:fixed;inset:0;background:rgba(255,0,0,.15);z-index:999;pointer-events:none;animation:wrongFlash .4s ease-out forwards}
@keyframes wrongFlash{from{opacity:1}to{opacity:0}}
.speed-bonus{font-family:'Fredoka One',cursive;font-size:1.4em;color:#FFD700;text-align:center;animation:bonusPop .5s ease-out;text-shadow:0 0 20px rgba(255,215,0,.5)}
@keyframes bonusPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.honk-text{position:absolute;top:10%;right:5%;font-family:'Fredoka One',cursive;font-size:1em;color:#FF6F00;animation:honkShake .3s ease-in-out infinite;z-index:160}
@keyframes honkShake{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

/* Register MG - CFA POS Style */
.reg-screen{width:100%;max-width:360px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.reg-header{background:var(--red);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.reg-header h3{font-size:.8em;font-weight:800}.reg-header .order-num{font-size:.65em;opacity:.8}
.reg-display{background:#f8f8f8;padding:8px 12px;min-height:50px;max-height:80px;overflow-y:auto;border-bottom:1px solid #eee;font-size:.72em;color:#333}
.reg-display .reg-item{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dotted #ddd}
.reg-display .reg-item:last-child{border:none}
.reg-display .reg-empty{color:#aaa;font-style:italic}
.reg-cats{display:flex;background:#f0f0f0;border-bottom:1px solid #ddd}
.reg-cat{flex:1;padding:8px 4px;text-align:center;font-size:.6em;font-weight:800;text-transform:uppercase;color:#666;cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;letter-spacing:.5px}
.reg-cat.active{color:var(--red);border-bottom-color:var(--red);background:#fff}
.reg-cat:active{background:#e8e8e8}
.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:10px;max-height:200px;overflow-y:auto}
.menu-btn{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:10px 6px;text-align:left;font-size:.7em;font-weight:700;color:#333;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:6px}
.menu-btn:active{background:var(--red);border-color:var(--red);transform:scale(.97);color:#fff}
.menu-btn .mi{width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0}
.reg-total{padding:6px 12px;background:#f8f8f8;border-top:1px solid #eee;display:flex;justify-content:space-between;font-size:.75em;font-weight:800;color:#333}
.reg-acts{display:flex;gap:6px;padding:10px}
.reg-acts .btn{flex:1;padding:11px;font-size:.78em;border-radius:8px}

/* Bagging MG */
.bag-wrap{width:100%;max-width:340px}
.bag-ticket{background:rgba(255,255,255,.95);border-radius:10px;padding:10px;margin-bottom:10px;font-size:.8em;color:#333;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.bag-ticket strong{color:var(--red)}
.conveyor{display:flex;gap:8px;overflow-x:auto;padding:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:12px;margin-bottom:12px;min-height:70px;align-items:center}
.food-box{width:56px;height:56px;background:rgba(255,255,255,.92);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:.85em;flex-shrink:0;cursor:pointer;border:2px solid transparent;transition:all .15s;font-weight:800;color:#333;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.food-box.picked{border-color:var(--success);background:#d4edda;box-shadow:0 0 12px rgba(40,167,69,.3)}
.food-box.wrong-pick{border-color:var(--danger);background:#ffcccc;animation:wrongItem .4s ease-out}
.food-box:active{transform:scale(.9)}
@keyframes wrongItem{0%{transform:translateX(-4px)}25%{transform:translateX(4px)}50%{transform:translateX(-4px)}75%{transform:translateX(4px)}100%{transform:translateX(0)}}
.bag-drop{width:110px;height:130px;margin:0 auto;background:linear-gradient(180deg,#d4a85a,#8B5e23);border-radius:4px 4px 12px 12px;position:relative;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;gap:3px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.bag-drop::before{content:'';position:absolute;top:-8px;left:-4px;right:-4px;height:14px;background:#d4a85a;border-radius:8px 8px 0 0}
.bag-mini{font-size:.68em;font-weight:800;background:rgba(255,255,255,.25);padding:2px 6px;border-radius:6px;color:#fff}

/* Curbside */
.park-grid{width:100%;max-width:340px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.park-spot{background:rgba(255,255,255,.05);border-radius:12px;padding:14px;text-align:center;color:#fff;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;border:2px dashed rgba(255,255,255,.15);transition:all .15s}
.park-spot.has-car{background:rgba(74,144,217,.12);border:2px solid rgba(74,144,217,.5);border-style:solid;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.park-spot:active{transform:scale(.96)}
.park-spot .car{font-size:1.4em;font-weight:900;color:rgba(255,255,255,.7);letter-spacing:1px}.park-spot .pname{font-size:.78em;font-weight:800}.park-spot .pnum{font-size:.65em;opacity:.5}

/* iPad MG */
.ipad-frame{width:100%;max-width:320px;background:#111;border-radius:18px;padding:10px}
.ipad-inner{background:#fff;border-radius:10px;padding:12px}
.ipad-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--red)}
.ipad-top h3{font-size:.8em;color:var(--red)}.ipad-top .car-tag{background:var(--blue);color:#fff;padding:1px 8px;border-radius:8px;font-size:.65em;font-weight:800}
.ipad-bubble{background:#f0f0f0;border-radius:12px 12px 12px 2px;padding:10px;margin-bottom:8px;font-size:.78em;color:#333;line-height:1.35}
.ipad-entered{background:var(--cream);border-radius:8px;padding:6px;min-height:28px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:3px;font-size:.75em}
.ipad-chip{background:var(--red);color:#fff;padding:2px 8px;border-radius:14px;font-size:.8em;font-weight:700}
.ipad-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;max-height:150px;overflow-y:auto;margin-bottom:8px}
.ipad-item{display:flex;align-items:center;gap:4px;background:#f8f8f8;border:2px solid #eee;border-radius:8px;padding:6px;font-size:.68em;font-weight:700;cursor:pointer;transition:all .12s}
.ipad-item:active{background:var(--red);color:#fff;border-color:var(--red)}
.weather-tag{color:#ccc;font-size:.7em;text-align:center;margin-bottom:6px}

/* DT Window */
.dt-wrap{width:100%;max-width:340px}
.dt-window{background:linear-gradient(180deg,#3a3a4a,#2a2a3a);border-radius:16px 16px 0 0;padding:16px;border:1px solid rgba(255,255,255,.08);border-bottom:none;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dt-car{font-size:1.8em;font-weight:900;color:rgba(255,255,255,.6);letter-spacing:2px;animation:carIn .4s ease-out}
@keyframes carIn{from{transform:translateX(80px);opacity:0}to{transform:translateX(0);opacity:1}}
.dt-who{color:#fff;font-weight:800;font-size:.95em;margin-top:6px}.dt-says{color:rgba(255,255,255,.5);font-size:.72em;font-style:italic;margin-top:3px}
.dt-counter{background:linear-gradient(180deg,#7a5030,#5a3818);padding:14px;border-radius:0 0 16px 16px;border:1px solid rgba(255,255,255,.05)}
.dt-ticket{background:rgba(255,255,255,.95);border-radius:8px;padding:8px 12px;font-size:.75em;margin-bottom:10px;color:#333;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.dt-ticket strong{color:var(--red)}
.dt-tray{display:flex;gap:6px;overflow-x:auto;padding:8px;background:rgba(0,0,0,.15);border-radius:10px;margin-bottom:10px;min-height:56px;align-items:center;border:1px solid rgba(255,255,255,.05)}
.dt-item{width:50px;height:50px;background:rgba(255,255,255,.92);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.75em;font-weight:800;flex-shrink:0;cursor:pointer;transition:all .15s;color:#333;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.dt-item.gone{opacity:.2;transform:scale(.75);pointer-events:none}
.dt-item:active{transform:scale(.9)}
.dt-handed{display:flex;gap:4px;flex-wrap:wrap;min-height:22px;margin-bottom:8px;justify-content:center}
.dt-hchip{background:rgba(255,255,255,.15);padding:2px 8px;border-radius:8px;font-size:.72em;color:#fff;font-weight:700}

/* App */
#app-screen{background:#fff;z-index:250}
.app-hdr{background:var(--red);color:#fff;padding:18px 14px;text-align:center}
.app-hdr h2{font-family:'Fredoka One',cursive;font-size:1.2em}.app-hdr .emp{font-size:.8em;opacity:.85;margin-top:3px}
.app-body{flex:1;overflow-y:auto;padding:14px}
.stat-card{background:#f8f8f8;border-radius:14px;padding:14px;margin-bottom:10px}
.stat-card h3{font-size:.75em;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.stat-val{font-size:1.8em;font-weight:900;color:var(--red)}
.stat-bar{width:100%;height:10px;background:#eee;border-radius:5px;overflow:hidden;margin-top:6px}
.stat-bar-f{height:100%;border-radius:5px;transition:width .5s}
.stat-badge{display:inline-block;padding:4px 14px;border-radius:16px;font-weight:800;font-size:.8em;margin-top:6px}
.sb-ok{background:#e8f5e9;color:var(--success)}.sb-warn{background:#fff3e0;color:#F57C00}.sb-bad{background:#ffebee;color:var(--danger)}.sb-dead{background:#000;color:var(--danger);font-size:1.1em;letter-spacing:2px}
.app-close{width:calc(100% - 28px);margin:14px;padding:12px;border:none;border-radius:12px;background:var(--red);color:#fff;font-family:'Nunito',sans-serif;font-weight:800;font-size:.95em;cursor:pointer}

/* Fired */
#fired-screen{background:linear-gradient(180deg,#1a1a2e,#0f0f1a);align-items:center;justify-content:center;text-align:center;color:#fff;padding:28px}
#fired-screen h1{font-family:'Fredoka One',cursive;font-size:2em;color:var(--danger);margin:12px 0 6px}
#fired-screen .reason{font-size:.88em;opacity:.65;margin-bottom:20px;line-height:1.4}
.final-stats{background:rgba(255,255,255,.05);border-radius:14px;padding:16px;margin-bottom:20px;width:100%}
.final-stats p{display:flex;justify-content:space-between;padding:5px 0;font-size:.85em;opacity:.75}
.final-stats span{font-weight:800}

/* Scold */
.scold{position:absolute;inset:0;z-index:280;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;color:#fff;animation:fadeIn .3s}
.scold h2{font-family:'Fredoka One',cursive;color:var(--danger);font-size:1.4em;margin-bottom:10px}
.scold p{font-size:.9em;line-height:1.45;opacity:.85;margin-bottom:16px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>

  <!-- TITLE -->
  <div id="title-screen" class="screen active">
    <div class="logo" style="font-family:'Fredoka One',cursive;font-size:2.2em;line-height:1.1;text-shadow:3px 3px 0 rgba(0,0,0,.3)">Justin's<br>Chick-fil-A<br>Shift</div>
    <div class="sub">Can you survive the shift?</div>
    <div class="title-char"><canvas id="title-justin" width="120" height="160"></canvas></div>
    <p style="font-size:.8em;opacity:.75;font-weight:600">Starring Justin Cook</p>
    <p style="font-size:.65em;opacity:.45;margin-top:3px">Distance Runner &bull; Terrible Employee</p>
    <button class="btn btn-w" id="start-btn" onclick="G.start()">Start Shift</button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-g"><span>Score:</span><span id="h-score">0</span></div>
    <div class="hud-g"><span>Patience</span><div id="patience-wrap"><div id="patience-fill"></div></div></div>
    <div class="hud-g"><span>Strikes:</span><span id="h-strikes">0/3</span></div>
    <button id="app-btn" onclick="G.toggleApp()">APP</button>
  </div>

  <!-- DIALOG -->
  <div id="dialog">
    <div class="dlg-head">
      <canvas class="dlg-portrait" id="dlg-portrait" width="40" height="52"></canvas>
      <div class="dlg-name" id="dlg-name">Luke</div>
    </div>
    <div class="dlg-text" id="dlg-text"></div>
    <div class="dlg-choices" id="dlg-choices"></div>
  </div>

  <!-- MINIGAME OVERLAY -->
  <div id="minigame-overlay">
    <div class="mg-title" id="mg-title"></div>
    <div class="mg-inst" id="mg-inst"></div>
    <div id="mg-timer-wrap" style="text-align:center"></div>
    <div class="mg-area" id="mg-area"></div>
  </div>

  <!-- APP -->
  <div id="app-screen" class="screen">
    <div class="app-hdr"><h2>CFA Team Member</h2><div class="emp">Justin Cook - Team Member</div></div>
    <div class="app-body" id="app-body"></div>
    <button class="app-close" onclick="G.toggleApp()">Close App</button>
  </div>

  <!-- FIRED -->
  <div id="fired-screen" class="screen">
    <h1 style="font-size:3em;margin-bottom:0">X</h1>
    <h1>TERMINATED</h1>
    <div class="reason" id="fired-reason"></div>
    <div class="final-stats" id="final-stats"></div>
    <button class="btn btn-r" onclick="G.restart()">Try Another Shift</button>
  </div>
</div>

<script>
// =============================================
// SPRITE DRAWING ENGINE
// =============================================
const Sprites = {
  // Draw a character on a canvas context
  // config: { hair, hairColor, skinColor, eyeColor, shirtColor, pantsColor, isApron, w, h }
  draw(ctx, cfg, w, h, frame=0) {
    ctx.clearRect(0, 0, w, h);
    const s = Math.min(w / 32, h / 48);
    const ox = (w - 32 * s) / 2, oy = (h - 48 * s) / 2;
    const r = (x, y, rw, rh, c) => { ctx.fillStyle = c; ctx.fillRect(ox + x*s, oy + y*s, rw*s, rh*s); };

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    ctx.beginPath();
    ctx.ellipse(ox+16*s, oy+47*s, 8*s, 2*s, 0, 0, Math.PI*2);
    ctx.fill();

    // Legs (slight walk animation)
    const legOff = Math.sin(frame * 0.15) * 2;
    r(10, 34+legOff, 5, 12, cfg.pantsColor);
    r(17, 34-legOff, 5, 12, cfg.pantsColor);
    // Shoes
    r(9, 44+legOff, 7, 3, '#222');
    r(16, 44-legOff, 7, 3, '#222');

    // Body / Shirt
    r(8, 20, 16, 16, cfg.shirtColor);
    // Apron
    if (cfg.isApron) {
      r(9, 22, 14, 12, '#fff');
      r(12, 22, 8, 2, '#ddd');
    }

    // Arms
    const armOff = Math.sin(frame * 0.15) * 1.5;
    r(4, 22+armOff, 5, 10, cfg.skinColor);
    r(23, 22-armOff, 5, 10, cfg.skinColor);
    // Hands
    r(4, 31+armOff, 5, 3, cfg.skinColor);
    r(23, 31-armOff, 5, 3, cfg.skinColor);

    // Head
    r(8, 4, 16, 16, cfg.skinColor);
    // Eyes
    r(11, 11, 3, 3, '#fff');
    r(18, 11, 3, 3, '#fff');
    r(12, 12, 2, 2, cfg.eyeColor);
    r(19, 12, 2, 2, cfg.eyeColor);
    // Mouth
    r(13, 16, 6, 1, '#c47');

    // Hair
    if (cfg.hair === 'short') {
      r(7, 2, 18, 6, cfg.hairColor);
      r(7, 4, 3, 6, cfg.hairColor);
      r(22, 4, 3, 6, cfg.hairColor);
    } else if (cfg.hair === 'curly') {
      r(6, 1, 20, 7, cfg.hairColor);
      r(6, 3, 4, 8, cfg.hairColor);
      r(22, 3, 4, 8, cfg.hairColor);
      // Curls
      r(5, 2, 2, 3, cfg.hairColor);
      r(25, 2, 2, 3, cfg.hairColor);
      r(8, 0, 3, 2, cfg.hairColor);
      r(20, 0, 3, 2, cfg.hairColor);
    } else if (cfg.hair === 'long') {
      r(6, 1, 20, 8, cfg.hairColor);
      r(6, 4, 4, 14, cfg.hairColor);
      r(22, 4, 4, 14, cfg.hairColor);
    } else if (cfg.hair === 'lots') {
      r(5, 0, 22, 8, cfg.hairColor);
      r(5, 3, 5, 10, cfg.hairColor);
      r(22, 3, 5, 10, cfg.hairColor);
      r(7, -1, 4, 3, cfg.hairColor);
      r(21, -1, 4, 3, cfg.hairColor);
    } else if (cfg.hair === 'red-long') {
      r(6, 1, 20, 7, '#CC4422');
      r(6, 4, 4, 16, '#CC4422');
      r(22, 4, 4, 16, '#CC4422');
    }

    // CFA hat (employees)
    if (cfg.hat) {
      r(6, 0, 20, 4, var_red);
      r(4, 3, 24, 2, var_dkred);
    }
  },

  // Character configs
  chars: {
    justin:   { hair:'short', hairColor:'#F0D060', skinColor:'#FDDCB5', eyeColor:'#4488CC', shirtColor:'#E51636', pantsColor:'#2c2c2c', isApron:true, hat:true },
    luke:     { hair:'short', hairColor:'#6B3A2A', skinColor:'#FDDCB5', eyeColor:'#4488CC', shirtColor:'#004F71', pantsColor:'#2c2c2c', isApron:false, hat:true },
    jacob:    { hair:'short', hairColor:'#4A3020', skinColor:'#FDDCB5', eyeColor:'#654321', shirtColor:'#E51636', pantsColor:'#2c2c2c', isApron:true, hat:true },
    andy:     { hair:'curly', hairColor:'#4A3020', skinColor:'#FDDCB5', eyeColor:'#654321', shirtColor:'#444', pantsColor:'#335', isApron:false, hat:false },
    hudson:   { hair:'short', hairColor:'#888', skinColor:'#E8C5A0', eyeColor:'#556B2F', shirtColor:'#2E5D3A', pantsColor:'#444', isApron:false, hat:false },
    gentry:   { hair:'short', hairColor:'#2A1A0A', skinColor:'#C89A6E', eyeColor:'#3A2510', shirtColor:'#E67E22', pantsColor:'#335', isApron:false, hat:false },
    henry:    { hair:'curly', hairColor:'#5A3A20', skinColor:'#FDDCB5', eyeColor:'#654321', shirtColor:'#27AE60', pantsColor:'#335', isApron:false, hat:false },
    black:    { hair:'short', hairColor:'#F0D060', skinColor:'#FDDCB5', eyeColor:'#556B2F', shirtColor:'#3498DB', pantsColor:'#335', isApron:false, hat:false },
    carter:   { hair:'short', hairColor:'#9A4A2A', skinColor:'#FDDCB5', eyeColor:'#556B2F', shirtColor:'#E74C3C', pantsColor:'#335', isApron:false, hat:false },
    reagan:   { hair:'long', hairColor:'#5A3020', skinColor:'#FDDCB5', eyeColor:'#3A7A4A', shirtColor:'#E91E63', pantsColor:'#446', isApron:false, hat:false },
    navaneeth:{ hair:'lots', hairColor:'#1A0A00', skinColor:'#B8864E', eyeColor:'#2A1A0A', shirtColor:'#F39C12', pantsColor:'#335', isApron:false, hat:false },
    walter:   { hair:'short', hairColor:'#5A4030', skinColor:'#FDDCB5', eyeColor:'#556B2F', shirtColor:'#1ABC9C', pantsColor:'#335', isApron:false, hat:false },
    ranel:    { hair:'short', hairColor:'#3A2A1A', skinColor:'#D4A06A', eyeColor:'#2A1A0A', shirtColor:'#9B59B6', pantsColor:'#335', isApron:false, hat:false },
    declan:   { hair:'short', hairColor:'#5A3A20', skinColor:'#FDDCB5', eyeColor:'#556B2F', shirtColor:'#2ECC71', pantsColor:'#335', isApron:false, hat:false },
    katy:     { hair:'red-long', hairColor:'#CC4422', skinColor:'#FDDCB5', eyeColor:'#4488CC', shirtColor:'#FF6B6B', pantsColor:'#446', isApron:false, hat:false },
  },

  drawChar(canvasOrCtx, charKey, frame=0) {
    let ctx, w, h;
    if (canvasOrCtx instanceof HTMLCanvasElement) {
      ctx = canvasOrCtx.getContext('2d');
      w = canvasOrCtx.width; h = canvasOrCtx.height;
    } else {
      ctx = canvasOrCtx; w = ctx.canvas.width; h = ctx.canvas.height;
    }
    const cfg = this.chars[charKey];
    if (cfg) this.draw(ctx, cfg, w, h, frame);
  }
};

const var_red = '#E51636', var_dkred = '#C41230';

// =============================================
// RESTAURANT RENDERER (Canvas top-down view)
// =============================================
const Restaurant = {
  canvas: null, ctx: null, W: 0, H: 0,

  // Station zones (relative 0-1)
  stations: {
    register:    { x: 0.15, y: 0.25, w: 0.22, h: 0.15, label: 'REGISTER', color: '#C41230' },
    bagging:     { x: 0.63, y: 0.25, w: 0.22, h: 0.15, label: 'BAGGING', color: '#8B4513' },
    drivethrough:{ x: 0.63, y: 0.55, w: 0.22, h: 0.15, label: 'DRIVE-THRU', color: '#004F71' },
    ipad:        { x: 0.15, y: 0.55, w: 0.22, h: 0.15, label: 'OUTSIDE iPAD', color: '#2E7D32' },
    curbside:    { x: 0.38, y: 0.78, w: 0.24, h: 0.14, label: 'CURBSIDE', color: '#E65100' },
    kitchen:     { x: 0.35, y: 0.05, w: 0.30, h: 0.12, label: 'KITCHEN (Jacob)', color: '#555' },
  },

  justin: { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5, frame: 0, moving: false },

  init() {
    this.canvas = document.getElementById('c');
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize());

    this.canvas.addEventListener('click', (e) => {
      if (!G.isRunning || G.inMinigame) return;
      const rect = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width / rect.width;
      const scaleY = this.canvas.height / rect.height;
      const cx = (e.clientX - rect.left) * scaleX;
      const cy = (e.clientY - rect.top) * scaleY;
      const rx = cx / this.W, ry = cy / this.H;

      // Check if tapped a station
      let tappedStation = null;
      for (const [key, st] of Object.entries(this.stations)) {
        if (key === 'kitchen') continue; // Can't go to kitchen
        if (rx >= st.x && rx <= st.x + st.w && ry >= st.y && ry <= st.y + st.h) {
          tappedStation = key;
          break;
        }
      }

      if (tappedStation) {
        const st = this.stations[tappedStation];
        this.justin.tx = st.x + st.w / 2;
        this.justin.ty = st.y + st.h / 2;
        this.justin.moving = true;
        this.justin.targetStation = tappedStation;
      } else {
        // Walk to tap point
        this.justin.tx = rx;
        this.justin.ty = ry;
        this.justin.moving = true;
        this.justin.targetStation = null;
      }
    });
  },

  resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = this.canvas.parentElement.getBoundingClientRect();
    this.canvas.width = rect.width * dpr;
    this.canvas.height = rect.height * dpr;
    this.W = this.canvas.width;
    this.H = this.canvas.height;
    this.ctx.imageSmoothingEnabled = false;
  },

  update() {
    const j = this.justin;
    if (j.moving) {
      const dx = j.tx - j.x, dy = j.ty - j.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const speed = 0.015;
      if (dist < speed) {
        j.x = j.tx; j.y = j.ty;
        j.moving = false;
        if (j.targetStation && G.isRunning && !G.inMinigame) {
          G.arriveAtStation(j.targetStation);
        }
      } else {
        j.x += (dx / dist) * speed;
        j.y += (dy / dist) * speed;
        j.frame++;
      }
    }
  },

  render() {
    const ctx = this.ctx, W = this.W, H = this.H;
    const t = Date.now() * 0.001; // time for animations

    // ---- OUTSIDE / PARKING LOT (bottom 30%) ----
    // Asphalt
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(0, H * 0.70, W, H * 0.30);
    // Subtle asphalt texture
    ctx.fillStyle = '#333';
    for (let i = 0; i < 40; i++) {
      const sx = ((i * 137) % W), sy = H * 0.72 + ((i * 73) % (H * 0.26));
      ctx.fillRect(sx, sy, 3, 1);
    }
    // Parking lines
    ctx.strokeStyle = '#FFD70088';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const px = W * 0.06 + i * W * 0.24;
      ctx.strokeRect(px, H * 0.78, W * 0.18, H * 0.16);
    }
    // Parked cars (decorative)
    this.drawCar(ctx, W*0.10, H*0.82, W*0.10, H*0.08, '#4a7ab5');
    this.drawCar(ctx, W*0.58, H*0.82, W*0.10, H*0.08, '#b54a4a');

    // Sidewalk strip
    ctx.fillStyle = '#c0b8a0';
    ctx.fillRect(0, H * 0.68, W, H * 0.04);
    // Sidewalk lines
    ctx.strokeStyle = '#b0a890';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += W * 0.08) {
      ctx.beginPath(); ctx.moveTo(x, H*0.68); ctx.lineTo(x, H*0.72); ctx.stroke();
    }

    // Grass strip along sidewalk
    ctx.fillStyle = '#5a8a3a';
    ctx.fillRect(0, H * 0.66, W, H * 0.03);

    // ---- BUILDING EXTERIOR WALLS ----
    // Main building shell
    ctx.fillStyle = '#E8DDD0'; // CFA cream brick
    ctx.fillRect(0, 0, W * 0.86, H * 0.67);
    // Brick texture
    ctx.strokeStyle = '#D8CCC0';
    ctx.lineWidth = 1;
    const brickH = H * 0.025, brickW = W * 0.06;
    for (let by = 0; by < H * 0.67; by += brickH) {
      const off = (Math.floor(by / brickH) % 2) * brickW * 0.5;
      for (let bx = off; bx < W * 0.86; bx += brickW) {
        ctx.strokeRect(bx, by, brickW, brickH);
      }
    }

    // Red accent band (top of building, CFA signature)
    ctx.fillStyle = '#E51636';
    ctx.fillRect(0, 0, W * 0.86, H * 0.03);
    ctx.fillStyle = '#C41230';
    ctx.fillRect(0, H * 0.03, W * 0.86, H * 0.008);

    // ---- KITCHEN (top area, behind counter) ----
    ctx.fillStyle = '#E0E0E0'; // stainless steel feel
    ctx.fillRect(W * 0.02, H * 0.04, W * 0.82, H * 0.14);
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 2;
    ctx.strokeRect(W * 0.02, H * 0.04, W * 0.82, H * 0.14);

    // Kitchen equipment - fryers
    ctx.fillStyle = '#888';
    ctx.fillRect(W * 0.32, H * 0.05, W * 0.08, H * 0.06);
    ctx.fillRect(W * 0.42, H * 0.05, W * 0.08, H * 0.06);
    ctx.fillStyle = '#DAA520'; // oil
    ctx.fillRect(W * 0.33, H * 0.06, W * 0.06, H * 0.04);
    ctx.fillRect(W * 0.43, H * 0.06, W * 0.06, H * 0.04);
    // Grill
    ctx.fillStyle = '#555';
    ctx.fillRect(W * 0.55, H * 0.05, W * 0.12, H * 0.06);
    ctx.strokeStyle = '#444';
    for (let gx = W*0.56; gx < W*0.66; gx += W*0.02) {
      ctx.beginPath(); ctx.moveTo(gx, H*0.06); ctx.lineTo(gx, H*0.10); ctx.stroke();
    }
    // Heat lamp / warming area
    ctx.fillStyle = '#C41230';
    ctx.fillRect(W * 0.70, H * 0.05, W * 0.10, H * 0.03);
    ctx.fillStyle = '#FFD70044';
    ctx.fillRect(W * 0.70, H * 0.08, W * 0.10, H * 0.04);
    // Prep counter
    ctx.fillStyle = '#ccc';
    ctx.fillRect(W * 0.05, H * 0.05, W * 0.22, H * 0.06);
    ctx.fillStyle = '#bbb';
    ctx.fillRect(W * 0.06, H * 0.06, W * 0.05, H * 0.04); // sink

    // ---- MAIN COUNTER (the long front counter) ----
    const counterY = H * 0.18;
    // Counter shadow
    ctx.fillStyle = 'rgba(0,0,0,.08)';
    ctx.fillRect(W * 0.02, counterY + H*0.05, W * 0.82, H * 0.02);
    // Counter surface (granite look)
    const cGrad = ctx.createLinearGradient(0, counterY, 0, counterY + H*0.05);
    cGrad.addColorStop(0, '#8B7355');
    cGrad.addColorStop(0.5, '#A0896A');
    cGrad.addColorStop(1, '#7A6348');
    ctx.fillStyle = cGrad;
    ctx.fillRect(W * 0.02, counterY, W * 0.82, H * 0.05);
    // Counter edge
    ctx.fillStyle = '#6B5335';
    ctx.fillRect(W * 0.02, counterY + H*0.045, W * 0.82, H * 0.008);

    // Registers on counter
    for (let ri = 0; ri < 3; ri++) {
      const rx = W * 0.08 + ri * W * 0.25;
      // Register base
      ctx.fillStyle = '#222';
      ctx.fillRect(rx, counterY - H*0.01, W*0.08, H*0.04);
      // Screen
      ctx.fillStyle = '#1a3a1a';
      ctx.fillRect(rx + W*0.005, counterY - H*0.005, W*0.07, H*0.025);
      // Screen content (green text)
      ctx.fillStyle = '#0f0';
      ctx.fillRect(rx + W*0.01, counterY + H*0.002, W*0.04, H*0.003);
      ctx.fillRect(rx + W*0.01, counterY + H*0.008, W*0.03, H*0.003);
    }

    // ---- DINING AREA (middle section) ----
    // Floor - nice warm tile
    ctx.fillStyle = '#D4C5A9';
    ctx.fillRect(W * 0.02, H * 0.24, W * 0.82, H * 0.42);
    // Tile pattern
    ctx.strokeStyle = '#C8B898';
    ctx.lineWidth = 1;
    const ts = W * 0.06;
    for (let tx2 = W*0.02; tx2 < W*0.84; tx2 += ts) {
      for (let ty = H*0.24; ty < H*0.66; ty += ts) {
        ctx.strokeRect(tx2, ty, ts, ts);
        // Alternating shade
        if ((Math.floor(tx2/ts) + Math.floor(ty/ts)) % 2 === 0) {
          ctx.fillStyle = 'rgba(0,0,0,.03)';
          ctx.fillRect(tx2, ty, ts, ts);
        }
      }
    }

    // Booth seating along left wall (clean, 2 booths)
    for (let ti = 0; ti < 2; ti++) {
      const tableY = H * 0.30 + ti * H * 0.15;
      // Booth back
      ctx.fillStyle = '#C41230';
      this.roundRect(ctx, W * 0.03, tableY, W * 0.025, H * 0.10, 3);
      ctx.fill();
      // Table
      ctx.fillStyle = '#A08060';
      this.roundRect(ctx, W * 0.065, tableY + H*0.02, W * 0.09, H * 0.06, 4);
      ctx.fill();
      // Opposite seat
      ctx.fillStyle = '#C41230';
      this.roundRect(ctx, W * 0.165, tableY + H*0.015, W * 0.025, H * 0.07, 3);
      ctx.fill();
    }

    // One center table (clean)
    const cx2 = W * 0.42, cy2 = H * 0.40;
    ctx.fillStyle = '#A08060';
    ctx.beginPath();
    ctx.arc(cx2, cy2, W * 0.035, 0, Math.PI * 2);
    ctx.fill();
    // 3 chairs
    for (let a = 0; a < 3; a++) {
      const ang = a * Math.PI * 0.667 - 0.5;
      ctx.fillStyle = '#C41230';
      this.roundRect(ctx, cx2 + Math.cos(ang)*W*0.055 - W*0.01, cy2 + Math.sin(ang)*W*0.055 - W*0.01, W*0.02, W*0.02, 3);
      ctx.fill();
    }

    // ---- BAGGING AREA (right side of counter) ----
    ctx.fillStyle = '#B8A080';
    ctx.fillRect(W * 0.60, H * 0.24, W * 0.22, H * 0.12);
    ctx.strokeStyle = '#A0886A';
    ctx.lineWidth = 2;
    ctx.strokeRect(W * 0.60, H * 0.24, W * 0.22, H * 0.12);
    // Paper bags
    ctx.fillStyle = '#C4A46A';
    ctx.fillRect(W * 0.62, H * 0.26, W * 0.04, H * 0.06);
    ctx.fillRect(W * 0.67, H * 0.26, W * 0.04, H * 0.06);
    ctx.fillRect(W * 0.72, H * 0.26, W * 0.04, H * 0.06);

    // ---- DRIVE-THROUGH LANE (right exterior) ----
    ctx.fillStyle = '#4a4a4a';
    ctx.fillRect(W * 0.86, 0, W * 0.14, H * 0.70);
    // Lane markings
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = '#FFD70066';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W * 0.93, H * 0.05);
    ctx.lineTo(W * 0.93, H * 0.68);
    ctx.stroke();
    ctx.setLineDash([]);
    // Drive-through window
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(W * 0.82, H * 0.38, W * 0.06, H * 0.08);
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 3;
    ctx.strokeRect(W * 0.82, H * 0.38, W * 0.06, H * 0.08);
    // Window shelf
    ctx.fillStyle = '#A0896A';
    ctx.fillRect(W * 0.81, H * 0.45, W * 0.08, H * 0.015);
    // Cars in drive-through (decorative, animated slightly)
    const carBob = Math.sin(t * 2) * 2;
    this.drawCar(ctx, W*0.88, H*0.15 + carBob, W*0.08, H*0.06, '#5577AA');
    this.drawCar(ctx, W*0.88, H*0.50, W*0.08, H*0.06, '#AA5555');
    this.drawCar(ctx, W*0.88, H*0.60, W*0.08, H*0.06, '#55AA77');

    // ---- OUTSIDE iPAD AREA (left exterior) ----
    // Small canopy/awning near entrance
    ctx.fillStyle = '#E51636';
    ctx.fillRect(W * 0.0, H * 0.55, W * 0.20, H * 0.03);
    // Door
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(W * 0.06, H * 0.58, W * 0.08, H * 0.08);
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 2;
    ctx.strokeRect(W * 0.06, H * 0.58, W * 0.08, H * 0.08);
    // Door handle
    ctx.fillStyle = '#888';
    ctx.fillRect(W * 0.12, H * 0.61, W * 0.01, H * 0.03);

    // ---- CURBSIDE PICKUP SIGN ----
    ctx.fillStyle = '#E51636';
    const signX = W * 0.35, signY = H * 0.73;
    ctx.fillRect(signX, signY, W * 0.30, H * 0.04);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(9, W * 0.022)}px Nunito`;
    ctx.textAlign = 'center';
    ctx.fillText('CURBSIDE PICKUP', signX + W * 0.15, signY + H * 0.028);

    // ---- STATION GLOW INDICATORS ----
    for (const [key, st] of Object.entries(this.stations)) {
      if (key === 'kitchen') continue;
      const sx = st.x * W, sy = st.y * H, sw = st.w * W, sh = st.h * H;
      if (G.isRunning && !G.inMinigame && G.availableStation === key) {
        // Pulsing glow
        const pulse = 0.4 + Math.sin(t * 4) * 0.3;
        ctx.shadowColor = '#FFD700';
        ctx.shadowBlur = 25;
        ctx.strokeStyle = `rgba(255, 215, 0, ${pulse})`;
        ctx.lineWidth = 3;
        // Rounded rect glow
        this.roundRect(ctx, sx - 2, sy - 2, sw + 4, sh + 4, 8);
        ctx.stroke();
        ctx.shadowBlur = 0;
        // Label pill
        ctx.fillStyle = 'rgba(255,215,0,0.9)';
        const lw = ctx.measureText(st.label).width + 16;
        this.roundRect(ctx, sx + sw/2 - lw/2, sy - H*0.03, lw, H*0.025, 6);
        ctx.fill();
        ctx.fillStyle = '#333';
        ctx.font = `bold ${Math.max(9, W * 0.02)}px Nunito`;
        ctx.textAlign = 'center';
        ctx.fillText(st.label, sx + sw/2, sy - H*0.012);
      }
    }

    // ---- CFA LOGO on wall ----
    ctx.fillStyle = '#E51636';
    ctx.font = `bold ${Math.max(10, W * 0.022)}px Fredoka One`;
    ctx.textAlign = 'center';
    ctx.fillText('Chick-fil-A', W * 0.50, H * 0.05 - 2);

    // ---- CHARACTERS ----
    // Jacob in kitchen
    this.drawMiniChar(ctx, 'jacob', W * 0.48, H * 0.06, W * 0.05, H * 0.10);
    // Luke near counter
    this.drawMiniChar(ctx, 'luke', W * 0.28, H * 0.20, W * 0.05, H * 0.10);

    // Justin (player) - slightly larger
    const jx = this.justin.x * W - W * 0.03;
    const jy = this.justin.y * H - H * 0.07;
    this.drawMiniChar(ctx, 'justin', jx, jy, W * 0.07, H * 0.12, this.justin.frame);

    // Name tag
    ctx.fillStyle = 'rgba(229,22,54,0.85)';
    ctx.font = `bold ${Math.max(8, W * 0.018)}px Nunito`;
    ctx.textAlign = 'center';
    const tagText = 'JUSTIN';
    const tagW2 = ctx.measureText(tagText).width + 10;
    this.roundRect(ctx, jx + W*0.035 - tagW2/2, jy - H*0.02, tagW2, H*0.018, 4);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(tagText, jx + W * 0.035, jy - H*0.006);

    // ---- BOTTOM INSTRUCTION BAR ----
    if (G.isRunning && !G.inMinigame) {
      // Frosted glass bar
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      this.roundRect(ctx, W*0.05, H - H*0.065, W*0.90, H*0.045, 12);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.max(10, W * 0.024)}px Nunito`;
      ctx.textAlign = 'center';
      if (G.availableStation) {
        const label = this.stations[G.availableStation]?.label || 'station';
        ctx.fillText(`Go to ${label}`, W/2, H - H*0.038);
      } else {
        ctx.fillText('Waiting for assignment...', W/2, H - H*0.038);
      }
    }
  },

  // Helper: draw rounded rectangle path
  roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  },

  // Helper: draw a simple top-down car
  drawCar(ctx, x, y, w, h, color) {
    // Body
    ctx.fillStyle = color;
    this.roundRect(ctx, x, y, w, h, h * 0.25);
    ctx.fill();
    // Windshield
    ctx.fillStyle = '#87CEEB88';
    ctx.fillRect(x + w * 0.15, y + h * 0.1, w * 0.7, h * 0.25);
    // Rear window
    ctx.fillRect(x + w * 0.2, y + h * 0.7, w * 0.6, h * 0.15);
    // Wheels
    ctx.fillStyle = '#222';
    ctx.fillRect(x - w*0.05, y + h*0.1, w*0.1, h*0.2);
    ctx.fillRect(x + w*0.95, y + h*0.1, w*0.1, h*0.2);
    ctx.fillRect(x - w*0.05, y + h*0.7, w*0.1, h*0.2);
    ctx.fillRect(x + w*0.95, y + h*0.7, w*0.1, h*0.2);
    // Headlights
    ctx.fillStyle = '#FFD70088';
    ctx.fillRect(x + w*0.1, y, w*0.15, h*0.08);
    ctx.fillRect(x + w*0.75, y, w*0.15, h*0.08);
  },

  drawMiniChar(ctx, charKey, x, y, w, h, frame=0) {
    // Create offscreen canvas for character
    const off = document.createElement('canvas');
    off.width = 32; off.height = 48;
    const oc = off.getContext('2d');
    const cfg = Sprites.chars[charKey];
    if (!cfg) return;
    Sprites.draw(oc, cfg, 32, 48, frame);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(off, x, y, w, h);
  },

  loop() {
    this.update();
    this.render();
    requestAnimationFrame(() => this.loop());
  }
};
